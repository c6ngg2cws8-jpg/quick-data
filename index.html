
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101b35">
  <title>Quick Data Ghana</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f6fb;
      color: #15213b;
    }
    header {
      background: #101b35;
      color: white;
      padding: 25px 15px;
      text-align: center;
    }
    header h1 { margin: 0; font-size: 32px; }
    header span { color: #35d07f; }
    header p { color: #d6dfec; }
    main {
      max-width: 500px;
      margin: 25px auto;
      padding: 0 15px;
    }
    .card {
      background: white;
      padding: 22px;
      border-radius: 16px;
      box-shadow: 0 4px 18px #15213b10;
    }
    label {
      display: block;
      margin: 17px 0 7px;
      font-weight: bold;
    }
    select, input, button {
      width: 100%;
      padding: 13px;
      border-radius: 9px;
      font-size: 16px;
    }
    select, input {
      border: 1px solid #ccd5e2;
      background: white;
    }
    button {
      margin-top: 22px;
      border: none;
      background: #16a765;
      color: white;
      font-weight: bold;
    }
    .notice {
      background: #fff7dc;
      color: #725414;
      border-radius: 10px;
      padding: 12px;
      font-size: 13px;
      line-height: 1.5;
      margin-top: 18px;
    }
    #message {
      margin-top: 15px;
      line-height: 1.5;
    }
    footer {
      text-align: center;
      color: #68758a;
      padding: 20px;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <header>
    <h1>Quick <span>Data</span></h1>
    <p>Fast. Affordable. Reliable. 🇬🇭</p>
  </header>

  <main>
    <section class="card">
      <h2>Order Data Bundles</h2>
      <p>Choose your network and enter your details.</p>

      <form id="orderForm">
        <label for="network">Network</label>
        <select id="network" required>
          <option value="">Choose network</option>
          <option value="mtn">MTN Ghana</option>
          <option value="telecel">Telecel Ghana</option>
        </select>

        <label for="phone">Recipient phone number</label>
        <input id="phone" type="tel"
          inputmode="tel" placeholder="e.g. 0241234567"
          pattern="0[0-9]{9}" required>

        <label for="bundle">Bundle size</label>
        <select id="bundle" required>
          <option value="">Choose bundle size</option>
          <option value="500">500 MB</option>
          <option value="1000">1 GB</option>
          <option value="2000">2 GB</option>
          <option value="5000">5 GB</option>
          <option value="10000">10 GB</option>
        </select>

        <button type="submit">Continue</button>
      </form>

      <div class="notice">
        <strong>Preview only:</strong> Orders, prices, payments
        and data delivery are not connected yet. Do not submit
        payment or expect data delivery from this form.
      </div>
      <div id="message" role="status"></div>
    </section>
  </main>

  <footer>© 2026 Quick Data Ghana</footer>

  <script>
    document.getElementById("orderForm").addEventListener(
      "submit", function(event) {
        event.preventDefault();
        const network =
          document.getElementById("network").value;
        const phone =
          document.getElementById("phone").value;
        const bundle =
          document.getElementById("bundle").value;

        document.getElementById("message").textContent =
          "Form preview: " +
          (network === "mtn" ? "MTN" : "Telecel") +
          ", " + bundle + " MB, recipient " + phone +
          ". No order has been placed or payment taken.";
      }
    );
  </script>
</body>
</html>
